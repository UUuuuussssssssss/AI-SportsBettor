[project]
name = "ai-sportsbettor"
version = "0.1.0"
description = "Timestamped sports news ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2,<1",
    "requests>=2.32.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "imageio-ffmpeg>=0.6.0,<1",
    "Pillow>=12.3.0,<13",
    "python-dateutil>=2.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "google-cloud-storage>=2.18.0",
    "cloud-sql-python-connector[pg8000]",
    "cryptography>=42.0.0",
]

[project.scripts]
enrich-news-dry-run = "src.enrich_news.dry_run:main"
enrich-news-backfill = "src.enrich_news.worker:main"
clob-order-books = "src.ingest_odds.clob_order_book_pipeline:main"
kalshi-markets = "src.ingest_odds.kalshi_markets_pipeline:main"
kalshi-order-books = "src.ingest_odds.kalshi_order_book_pipeline:main"
kalshi-trades = "src.ingest_odds.kalshi_trades_pipeline:main"
entity-bank-nflverse = "src.entity_bank.nflverse_sync:main"
entity-bank-nflverse-poll = "src.entity_bank.nflverse_poll:main"
entity-bank-coaches = "src.entity_bank.coach_sync:main"
entity-bank-gamma-backfill = "src.entity_bank.gamma_backfill:main"
entity-bank-resolve = "src.entity_bank.worker:main"
entity-bank-audit = "src.entity_bank.audit:main"
job-queue-seed = "src.jobs.seed:main"
job-worker = "src.jobs.worker:main"
link-news-markets = "src.linking.linker:main"
build-reaction-labels = "src.linking.reactions:main"
export-training-dataset = "src.linking.export_dataset:main"
label-training-dataset = "src.linking.labels:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

